<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIMETIC SOFT - Nova Senha</title>
    <link rel="stylesheet" href="../CSS/tela-nova-senha.css">
    <link rel="stylesheet" href="../CSS/cabecalho-padrao.css">
    <link rel="stylesheet" href="../CSS/botoes-padrao.css">
    <link rel="stylesheet" href="../CSS/senha-visivel.css">
    <link rel="stylesheet" href="../CSS/responsividade-global.css">
    <!--TELA CRIADA POR: MATHEUS LINO-->
</head>
<body class="pagina-nova-senha">

    <!-- Cabeçalho padrão do sistema -->
    <header class="cabecalho">
        <img src="../assets/logo.png" alt="Logo MIMETIC SOFT" class="logo">
        <h1>MIMETIC SOFT</h1>

        <button type="button" class="menu-funcionario" id="menu-funcionario">
            <span>Nome Funcionário</span>
            <span class="seta">⌄</span>
        </button>
    </header>

    <main class="conteudo-principal">
        <section class="introducao">
            <h2>CRIE UMA NOVA SENHA</h2>
            <p>Digite o código de 6 dígitos enviado para o seu e-mail e escolha uma senha forte para manter sua conta segura.</p>
        </section>

        <section class="card-nova-senha">
            <form id="form-nova-senha" autocomplete="off">
                <div class="campo">
                    <label for="codigo">Código de Recuperação:<span class="asterisco-obrigatorio" aria-hidden="true">*</span></label>
                    <input type="text" id="codigo" name="codigo" required inputmode="numeric" maxlength="6" autocomplete="one-time-code">
                </div>

                <div class="campo">
                    <label for="nova-senha">Nova Senha:<span class="asterisco-obrigatorio" aria-hidden="true">*</span></label>
                    <input type="password" id="nova-senha" name="nova-senha" required autocomplete="new-password">
                </div>

                <div class="campo">
                    <label for="confirmar-senha">Confirme sua Senha:<span class="asterisco-obrigatorio" aria-hidden="true">*</span></label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" required autocomplete="new-password">
                </div>

                <!-- Requisitos visuais da senha, conforme o protótipo -->
                <div class="requisitos">
                    <strong>SUA SENHA DEVE CONTER:</strong>
                    <span id="req-tamanho" class="invalido">✕ 8 caracteres ou mais</span>
                    <span id="req-maiuscula" class="invalido">✕ 1 letra maiúscula</span>
                    <span id="req-minuscula" class="invalido">✕ 1 letra minúscula</span>
                    <span id="req-numero" class="invalido">✕ 1 número</span>
                    <span id="req-simbolo" class="invalido">✕ 1 símbolo (ex.: @, #, !, $)</span>
                </div>

                <div class="acoes">
                    <button type="submit" class="botao-confirmar">CONFIRMAR</button>
                    <button type="button" class="botao-voltar" id="botao-voltar">VOLTAR</button>
                </div>
            </form>
        </section>
    </main>

    <script src="../JAVASCRIPT/api-client.js"></script>
    <script src="../JAVASCRIPT/tela-comum.js"></script>
    <script src="../JAVASCRIPT/tela-nova-senha.js"></script>
<script src="../JAVASCRIPT/app-core.js"></script>
    <script src="../JAVASCRIPT/senha-visivel.js"></script>
</body>
</html>
